<title>Upfront</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;600&display=swap">
<style>
/* Layout: a navy stage where the conversation plays out and the answer appears, then frosted panels that break the cost down. */
:root{
  --navy:#0a1628; --navy-70:#3c4655; --navy-40:#8a8f99; --navy-15:#e7e8eb; --white:#fff;
  --teal:#00a88c; --teal-2:#00bc9d; --teal-text:#087969;
  --bg:#f6f7f9; --fg:#0a1628; --fg-2:#3c4655; --fg-3:#8a8f99; --rule:rgba(10,22,40,.08);
  --glass:rgba(255,255,255,.62); --glass-edge:rgba(255,255,255,.78); --glass-hi:rgba(255,255,255,.95);
  --glass-shadow:inset 0 1px 0 var(--glass-hi),0 34px 80px -58px rgba(10,22,40,.58);
  --track:rgba(10,22,40,.06); --bar:#c9d1dd; --bar-2:#7f9cc4; --bar-3:#3c5a8a; --out:#b0453e; --warn:#8b5a1a;
  --blob-a:rgba(0,168,140,.22); --blob-b:rgba(80,120,200,.18);
  --font-display:"Outfit",system-ui,-apple-system,"Segoe UI",sans-serif; --font-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --ease:cubic-bezier(.22,.61,.36,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1322; --fg:#f2f5fa; --fg-2:#b9c2d0; --fg-3:#7e889a; --rule:rgba(255,255,255,.08);
  --glass:rgba(24,33,52,.6); --glass-edge:rgba(255,255,255,.1); --glass-hi:rgba(255,255,255,.08);
  --glass-shadow:inset 0 1px 0 var(--glass-hi),0 34px 80px -58px rgba(0,0,0,.8);
  --track:rgba(255,255,255,.07); --bar:#3a475c; --bar-2:#6f8fc2; --bar-3:#a9c2ea; --out:#f08a80; --warn:#e9b962;
  --teal-text:#2bc4a8; --navy-15:rgba(255,255,255,.12);
  --blob-a:rgba(0,168,140,.16); --blob-b:rgba(80,120,200,.14); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1322; --fg:#f2f5fa; --fg-2:#b9c2d0; --fg-3:#7e889a; --rule:rgba(255,255,255,.08);
  --glass:rgba(24,33,52,.6); --glass-edge:rgba(255,255,255,.1); --glass-hi:rgba(255,255,255,.08);
  --glass-shadow:inset 0 1px 0 var(--glass-hi),0 34px 80px -58px rgba(0,0,0,.8);
  --track:rgba(255,255,255,.07); --bar:#3a475c; --bar-2:#6f8fc2; --bar-3:#a9c2ea; --out:#f08a80; --warn:#e9b962;
  --teal-text:#2bc4a8; --navy-15:rgba(255,255,255,.12);
  --blob-a:rgba(0,168,140,.16); --blob-b:rgba(80,120,200,.14); color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input{font:inherit}
.tab{font-variant-numeric:tabular-nums}
h1,h2{font-family:var(--font-display);font-weight:600;letter-spacing:-.02em;margin:0;text-wrap:balance}

/* stage */
.stage{position:relative;background:var(--navy);color:var(--white);overflow:hidden;padding-bottom:80px;min-height:100vh}
.stage::before{content:"";position:absolute;inset:-20% -10% auto -10%;height:70%;background:radial-gradient(60% 60% at 30% 30%,rgba(0,168,140,.28),transparent 60%),radial-gradient(50% 50% at 80% 20%,rgba(80,120,200,.22),transparent 60%);filter:blur(30px);pointer-events:none}
.nav{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;height:72px;max-width:1040px;margin:0 auto;padding-inline:clamp(20px,4vw,40px)}
.wordmark{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:600;font-size:19px}
.wordmark i{width:10px;height:10px;border-radius:50%;background:var(--teal)}
.replay{color:rgba(255,255,255,.62);background:transparent;border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:7px 14px;font-size:13px;cursor:pointer;transition:border-color .2s,color .2s}
.replay:hover{border-color:rgba(255,255,255,.6);color:#fff}
.stage-inner{position:relative;z-index:1;max-width:760px;margin:0 auto;padding-inline:clamp(20px,4vw,40px);padding-top:clamp(20px,5vw,56px)}

.thread{display:flex;flex-direction:column;gap:14px}
.msg{opacity:0;transform:translateY(10px);transition:opacity .5s var(--ease),transform .5s var(--ease)}
.msg.in{opacity:1;transform:none}
.user{align-self:flex-end;max-width:82%;padding:14px 18px;border-radius:22px 22px 6px 22px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);font-size:17px;line-height:1.5}
.caret{display:inline-block;width:2px;height:1.05em;background:var(--teal);vertical-align:-3px;margin-left:2px;animation:blink 1s steps(1) infinite}
.caret.off{display:none}
@keyframes blink{50%{opacity:0}}
.sys{align-self:flex-start;max-width:92%;padding:18px 22px;border-radius:22px 22px 22px 6px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);-webkit-backdrop-filter:blur(14px) saturate(140%);backdrop-filter:blur(14px) saturate(140%)}
.sys p{margin:0;font-size:16px;color:rgba(255,255,255,.88)}
.sys .loc{font-size:13px;color:rgba(255,255,255,.5);margin-top:4px}
.sys .loc u{text-decoration:none;border-bottom:1px solid rgba(255,255,255,.3);margin-left:8px;cursor:pointer}
.qs{display:flex;flex-wrap:wrap;gap:14px 28px;margin-top:16px}
.q{font-size:14px;color:rgba(255,255,255,.7)}
.q small{display:block;font-size:12px;color:rgba(255,255,255,.4)}
.dots{display:inline-flex;gap:5px;height:16px;align-items:center}
.dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.5);animation:pulse 1.2s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes pulse{0%,80%,100%{opacity:.3;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}
.seg{display:inline-flex;gap:4px;padding:4px;border-radius:999px;background:rgba(255,255,255,.08);margin-top:8px}
.seg b{font-weight:500;font-size:14px;padding:7px 14px;border-radius:999px;color:rgba(255,255,255,.7);transition:background .35s var(--ease),color .35s var(--ease),box-shadow .35s}
.seg b.on{background:#fff;color:var(--navy);box-shadow:0 6px 18px -8px rgba(0,0,0,.6)}
.field{display:inline-flex;align-items:center;gap:6px;margin-top:8px;padding:9px 14px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);font-size:14px;color:#fff;min-width:150px}
.field span{color:rgba(255,255,255,.35)}
.field.on{border-color:rgba(255,255,255,.5)}

.work{align-self:stretch;margin-top:6px;padding:18px 22px;border-radius:18px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1)}
.work ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:9px}
.work li{display:flex;align-items:center;gap:12px;font-size:14px;color:rgba(255,255,255,.4);opacity:0;transform:translateY(6px);transition:all .4s var(--ease)}
.work li.in{opacity:1;transform:none}
.work li.done{color:rgba(255,255,255,.85)}
.work li i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.2);flex-shrink:0;transition:background .3s}
.work li.done i{background:var(--teal)}
.work .bar{height:2px;background:rgba(255,255,255,.1);border-radius:1px;margin-top:16px;overflow:hidden}
.work .bar i{display:block;height:100%;width:0;background:var(--teal);transition:width .6s var(--ease)}

.tile{margin-top:26px;padding:clamp(24px,3.4vw,36px);border-radius:24px;color:var(--navy);background:rgba(255,255,255,.9);border:1px solid rgba(255,255,255,.9);-webkit-backdrop-filter:blur(26px) saturate(160%);backdrop-filter:blur(26px) saturate(160%);box-shadow:inset 0 1px 0 #fff,0 40px 90px -50px rgba(0,0,0,.7);opacity:0;transform:translateY(22px) scale(.985);transition:opacity .7s var(--ease),transform .7s var(--ease)}
.tile.in{opacity:1;transform:none}
.tile .k{font-size:13px;color:var(--navy-70);margin:0 0 6px}
.tile h1{font-size:clamp(30px,4.2vw,44px);line-height:1.05;letter-spacing:-.03em}
.tile .line{margin:12px 0 26px;color:var(--navy-70);font-size:17px;max-width:46ch;text-wrap:pretty}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--navy-15)}
.kpi{padding:16px 18px 2px 0}
.kpi+.kpi{padding-left:18px;border-left:1px solid var(--navy-15)}
.kpi span{display:block;font-size:12px;color:var(--navy-70)}
.kpi b{display:block;font-family:var(--font-display);font-weight:600;font-size:clamp(22px,2.6vw,30px);letter-spacing:-.02em;margin-top:2px;line-height:1.1}
.kpi.you b{color:var(--teal-text)}
.kpi small{display:block;font-size:12px;color:var(--navy-40);margin-top:4px}
.kpi small u{text-decoration:none;border-bottom:1px solid var(--navy-15);cursor:pointer}
.tile .cta{margin-top:26px}
.btn{min-height:46px;padding:0 22px;border-radius:999px;border:0;background:var(--teal);color:var(--navy);font-weight:500;cursor:pointer;transition:transform .2s,background .2s,box-shadow .2s;white-space:nowrap}
.btn:hover{transform:translateY(-2px);background:var(--teal-2);box-shadow:0 8px 22px rgba(0,168,140,.25)}

/* story */
.story{position:relative;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(70px);pointer-events:none}
.blob.a{width:620px;height:620px;left:-200px;top:160px;background:var(--blob-a)}
.blob.b{width:560px;height:560px;right:-180px;top:900px;background:var(--blob-b)}
.blob.c{width:600px;height:600px;left:-160px;top:1700px;background:var(--blob-b)}
.col{position:relative;max-width:760px;margin:0 auto;padding-inline:clamp(20px,4vw,40px);padding-block:clamp(48px,7vw,80px) 72px;display:flex;flex-direction:column;gap:clamp(30px,4.5vw,48px)}
.panel{padding:clamp(24px,3.4vw,36px);border-radius:24px;background:var(--glass);border:1px solid var(--glass-edge);-webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%);box-shadow:var(--glass-shadow);opacity:0;transform:translateY(26px);transition:opacity .8s var(--ease),transform .8s var(--ease)}
.panel.in{opacity:1;transform:none}
.panel h2{font-size:clamp(23px,2.8vw,30px);line-height:1.15;max-width:24ch}
.panel .line{margin:8px 0 24px;color:var(--fg-2);font-size:16px;max-width:54ch;text-wrap:pretty}
.panel .fine{margin:16px 0 0;color:var(--fg-3);font-size:13.5px;max-width:58ch;text-wrap:pretty}
.head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}

/* stacked */
.sum{display:flex;align-items:baseline;gap:14px;margin-bottom:12px}
.sum b{font-family:var(--font-display);font-size:34px;font-weight:600;letter-spacing:-.02em}
.sum span{color:var(--fg-3);font-size:14px}
.stack{display:flex;gap:3px;height:30px}
.stack i{display:block;height:100%;border-radius:6px;width:0;transition:width 1.1s var(--ease)}
.in .stack i{width:var(--w)}
.leg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:18px}
.leg div{font-size:13.5px;color:var(--fg-2);padding-top:10px;border-top:2px solid var(--c);min-width:0}
.leg b{display:block;color:var(--fg);font-weight:600;font-size:16px}

/* split */
.split{display:flex;gap:3px;height:30px;margin-top:4px}
.split i{display:block;height:100%;border-radius:6px;width:0;transition:width 1.1s var(--ease)}
.in .split i{width:var(--w)}
.leg.two{grid-template-columns:1fr 1fr}

/* toggle */
.tg{display:inline-flex;gap:3px;padding:3px;border-radius:999px;background:var(--track);flex-shrink:0}
.tg button{border:0;background:transparent;color:var(--fg-3);font-size:13px;font-weight:500;padding:6px 14px;border-radius:999px;cursor:pointer;transition:background .3s,color .3s,box-shadow .3s}
.tg button.on{background:var(--glass-hi);color:var(--fg);box-shadow:0 4px 12px -6px rgba(10,22,40,.4)}

/* ranked list */
.rank{display:flex;flex-direction:column;gap:12px}
.r{display:grid;grid-template-columns:200px 1fr 96px;gap:16px;align-items:center}
.r .n{font-weight:500;line-height:1.3;min-width:0}
.r .n small{display:block;color:var(--fg-3);font-weight:400;font-size:13px}
.r .n em{font-style:normal;font-size:12.5px;color:var(--fg-3)}
.r .n em.teal{color:var(--teal-text)}.r .n em.warn{color:var(--warn)}
.r .t{height:16px;border-radius:5px;background:var(--track);overflow:hidden}
.r .t i{display:block;height:100%;border-radius:5px;background:var(--bar);width:0;transition:width 1.1s var(--ease)}
.in .r .t i{width:var(--w)}
.r.me .t i{background:var(--teal)}
.r.out .t i{background:var(--out)}
.r.unv .t i{background:repeating-linear-gradient(135deg,var(--bar) 0 6px,transparent 6px 11px)}
.r .v{text-align:right;font-weight:600}
.r .v small{display:block;color:var(--fg-3);font-weight:400;font-size:12px}

/* map */
.map{position:relative;margin-top:4px;--water:#dbe6f0;--land:#f3f4f6;--park:#dcebdc;--road:#ffffff;--road-edge:#d3d9e2;--fwy:#e3e7ee;--halo:#f3f4f6}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .map{--water:#0e1a2c;--land:#182235;--park:#172a26;--road:#243149;--road-edge:#1d2840;--fwy:#2a3852;--halo:#182235}}
:root[data-theme="dark"] .map{--water:#0e1a2c;--land:#182235;--park:#172a26;--road:#243149;--road-edge:#1d2840;--fwy:#2a3852;--halo:#182235}
.map svg{width:100%;height:auto;display:block;border-radius:16px;overflow:hidden;background:var(--water)}
.map .land{fill:var(--land)}
.map .park{fill:var(--park)}
.map .road{fill:none;stroke:var(--road);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.map .road-e{fill:none;stroke:var(--road-edge);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.map .fwy{fill:none;stroke:var(--fwy);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
.map .hood{font-size:10.5px;fill:var(--fg-3);font-family:var(--font-body);letter-spacing:.08em;text-transform:uppercase;text-anchor:middle;pointer-events:none;opacity:.85}
.map .lab{font-size:12px;fill:var(--fg);font-family:var(--font-body);pointer-events:none;font-weight:500;paint-order:stroke;stroke:var(--halo);stroke-width:3px;stroke-linejoin:round}
.map .you{fill:var(--fg);stroke:var(--halo);stroke-width:3}
.map .youring{fill:none;stroke:var(--fg);stroke-width:1.2;opacity:.35}
.map .pt{cursor:pointer;transition:r .2s;stroke:var(--halo);stroke-width:2.5}
.map .pt:hover{r:11}
.map .pt.lo{fill:var(--teal)}.map .pt.mid{fill:var(--bar-2)}.map .pt.hi{fill:var(--out)}
.map .pt.unv{fill:var(--land);stroke:var(--fg-3);stroke-width:2;stroke-dasharray:3 3}
.map .scale{fill:none;stroke:var(--fg-3);stroke-width:1.5}
.map .scalet{font-size:10.5px;fill:var(--fg-3);font-family:var(--font-body)}
.tip{position:absolute;z-index:3;pointer-events:none;opacity:0;transform:translate(-50%,calc(-100% - 16px));padding:12px 16px;border-radius:14px;background:var(--tip-bg);color:var(--tip-fg);box-shadow:0 1px 2px rgba(0,0,0,.2),0 16px 36px -10px rgba(0,0,0,.45);font-size:13.5px;line-height:1.45;white-space:nowrap;transition:opacity .15s}
.tip::after{content:"";position:absolute;left:50%;bottom:-6px;width:12px;height:12px;background:var(--tip-bg);transform:translateX(-50%) rotate(45deg);border-radius:2px}
.tip.on{opacity:1}
.tip b{display:block;font-size:15px;font-weight:600;margin-bottom:2px}
.tip strong{font-weight:600}
.tip span{color:var(--tip-muted)}
.map{--tip-bg:#0a1628;--tip-fg:#fff;--tip-muted:rgba(255,255,255,.6)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .map{--tip-bg:#ffffff;--tip-fg:#0a1628;--tip-muted:#5b6473}}
:root[data-theme="dark"] .map{--tip-bg:#ffffff;--tip-fg:#0a1628;--tip-muted:#5b6473}
.mkey{display:flex;gap:18px;flex-wrap:wrap;font-size:12.5px;color:var(--fg-3);margin-top:6px}
.mkey i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}

/* plan bars */
.plans{display:flex;flex-direction:column;gap:10px}
.p{display:grid;grid-template-columns:190px 1fr 80px;gap:14px;align-items:center;font-size:15px}
.p .n{color:var(--fg-2)}
.p.me .n{color:var(--teal-text);font-weight:600}
.p .t{height:14px;border-radius:5px;background:var(--track);overflow:hidden}
.p .t i{display:block;height:100%;border-radius:5px;background:var(--bar);width:0;transition:width 1.1s var(--ease)}
.in .p .t i{width:var(--w)}
.p.me .t i{background:var(--teal)}
.p.cash .t i{background:var(--bar-3)}
.p .v{text-align:right;font-weight:600}

.book{display:flex;justify-content:center;padding:6px 0 0}

@media (max-width:640px){
  .kpis{grid-template-columns:1fr 1fr}
  .kpi{padding:14px 12px 2px 0}
  .kpi+.kpi{padding-left:12px}
  .kpi:nth-child(3){border-left:0;padding-left:0}
  .leg{grid-template-columns:1fr 1fr}
  .r{grid-template-columns:1fr;gap:6px}
  .r .v{text-align:left}
  .p{grid-template-columns:1fr;gap:4px}
  .p .v{text-align:left}
  .user,.sys{max-width:100%}
  .map .lab{font-size:14px}
}
@media (prefers-reduced-motion:reduce){
  .msg,.tile,.panel,.work li,.stack i,.split i,.r .t i,.p .t i{transition:none}
}

.askbar{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 20px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);margin-top:18px}
.askbar input{flex:1;background:transparent;border:0;outline:0;color:#fff;font-size:17px;min-width:0}
.askbar input::placeholder{color:rgba(255,255,255,.4)}
.askbar button{width:40px;height:40px;border-radius:50%;border:0;background:var(--teal);color:var(--navy);font-weight:600;cursor:pointer}
.fieldin{background:transparent;border:0;outline:0;color:#fff;width:110px;font-size:14px}
.est{font-size:11px;color:var(--fg-3);font-weight:400}
.seg b{cursor:pointer}
.intro{color:rgba(255,255,255,.55);font-size:15px;margin:0 0 8px}
.mini{border:1px solid var(--rule);background:var(--glass-hi);color:var(--fg);border-radius:999px;padding:4px 12px;font-size:12.5px;cursor:pointer}
.mini:disabled{color:var(--fg-3)}
.minilog{grid-column:1/-1;font-size:12.5px;color:var(--teal-text);padding:2px 0 0}
.radius{text-decoration:none;border-bottom:1px dashed var(--fg-3);cursor:pointer}
.r .act{display:flex;align-items:center}
[hidden]{display:none!important}
.r .n em.note{display:block;color:var(--fg-3);font-size:12px}
.leg{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.work .screen{position:relative;margin-top:14px;border-radius:12px;overflow:hidden;border:1px solid rgba(255,255,255,.12);background:#000;max-height:260px;aspect-ratio:2/1}
.work .screen .cap{position:absolute;left:10px;bottom:8px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.85);background:rgba(10,22,40,.6);padding:3px 8px;border-radius:999px}
.work .screen img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.work .steer{display:flex;gap:8px;margin-top:12px}
.work .steer input{flex:1;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:8px 14px;color:#fff;font-size:13px;outline:0}
.work .steer input::placeholder{color:rgba(255,255,255,.35)}
.work .steer button{border:0;border-radius:999px;padding:8px 14px;background:rgba(255,255,255,.12);color:#fff;font-size:13px;cursor:pointer}
.r img.rowshot{grid-column:1/-1;width:100%;border-radius:10px;border:1px solid var(--rule);margin-top:6px}
</style>

<section class="stage">
  <div class="nav">
    <div class="wordmark"><i></i>Upfront</div>
    <button class="replay" id="replay" type="button">Start over</button>
  </div>
  <div class="stage-inner">
    <p class="intro" id="loc">Near the Mission, San Francisco</p>
